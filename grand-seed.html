function bw(col,docs,idf){
  var c=Promise.resolve();
  for(var i=0;i<docs.length;i+=450){
    var ch=docs.slice(i,i+450);var e=Math.min(i+450,docs.length);
    c=c.then((function(ch,e){return function(){
      var b=db.batch();
      ch.forEach(function(d){b.set(db.collection(col).doc(d[idf]),d,{merge:true});});
      return b.commit().then(function(){lg("  "+e+" / "+docs.length);});
    };})(ch,e));
  }
  return c;
}
document.getElementById("btnSeed").addEventListener("click",function(){
  dis();lg("Seeding...");
  Promise.resolve()
    .then(function(){lg("Users...");return bw("users",D.users,"username");})
    .then(function(){lg("Done. Tournaments...");return bw("tournaments",D.tournaments,"code");})
    .then(function(){lg("Done. Clearing old U12/U16 games...");return db.collection("games").where("tournament","in",["U12","U16"]).get();})
    .then(function(snap){
      var ids=[];snap.forEach(function(d){ids.push(d.id);});
      if(!ids.length)return Promise.resolve();
      var c=Promise.resolve();
      for(var i=0;i<ids.length;i+=450){
        var ch=ids.slice(i,i+450);var e=Math.min(i+450,ids.length);
        c=c.then((function(ch,e){return function(){
          var b=db.batch();
          ch.forEach(function(id){b.delete(db.collection("games").doc(id));});
          return b.commit().then(function(){lg("  cleared "+e+" / "+ids.length);});
        };})(ch,e));
      }
      return c;
    })
    .then(function(){lg("Done. Games ("+D.games.length+")...");return bw("games",D.games,"gameId");})
    .then(function(){lg("Done. Players ("+D.players.length+")...");return bw("players",D.players,"playerId");})
    .then(function(){lg("\nSEED COMPLETE. Lock rules now.");ena();})
    .catch(function(e){lg("ERROR: "+e.message);ena();});
});
document.getElementById("btnReset").addEventListener("click",function(){
  if(!confirm("Clear all results?"))return;
  dis();lg("Clearing...");
  db.collection("games").get().then(function(snap){
    var ids=[];snap.forEach(function(d){ids.push(d.id);});
    var c=Promise.resolve();
    for(var i=0;i<ids.length;i+=450){
      var ch=ids.slice(i,i+450);var e=Math.min(i+450,ids.length);
      c=c.then((function(ch,e){return function(){
        var b=db.batch();
        ch.forEach(function(id){b.update(db.collection("games").doc(id),{result:"",remarks:"",updatedBy:"",updatedTime:"",whiteFlags:0,blackFlags:0});});
        return b.commit().then(function(){lg("  "+e+" / "+ids.length);});
      };})(ch,e));
    }
    return c;
  }).then(function(){lg("\nRESET COMPLETE.");ena();})
    .catch(function(e){lg("ERROR: "+e.message);ena();});
});
