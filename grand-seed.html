function batchWrite(col, docs, idField) {
  var chain = Promise.resolve();
  for (var i = 0; i < docs.length; i += 450) {
    var chunk = docs.slice(i, i + 450);
    var end = Math.min(i + 450, docs.length);
    chain = chain.then((function(ch, e) {
      return function() {
        var batch = db.batch();
        ch.forEach(function(d) {
          batch.set(db.collection(col).doc(d[idField]), d, {merge:true});
        });
        return batch.commit().then(function() { log('  ' + e + ' / ' + docs.length); });
      };
    })(chunk, end));
  }
  return chain;
}

document.getElementById('btnSeed').addEventListener('click', function() {
  dis(); log('Seeding...');
  Promise.resolve()
    .then(function() { log('Writing ' + seedData.users.length + ' users...'); return batchWrite('users', seedData.users, 'username'); })
    .then(function() { log('Users done. Writing tournaments...'); return batchWrite('tournaments', seedData.tournaments, 'code'); })
    .then(function() { log('Tournaments done. Writing ' + seedData.games.length + ' games...'); return batchWrite('games', seedData.games, 'gameId'); })
    .then(function() { log('\nSEED COMPLETE. Lock your Firestore rules now.'); ena(); })
    .catch(function(e) { log('ERROR: ' + e.message); ena(); });
});

document.getElementById('btnReset').addEventListener('click', function() {
  if (!confirm('Clear all results? Keeps White/Black names but wipes scores.')) return;
  dis(); log('Clearing...');
  db.collection('games').get().then(function(snap) {
    var ids = []; snap.forEach(function(d) { ids.push(d.id); });
    var chain = Promise.resolve();
    for (var i = 0; i < ids.length; i += 450) {
      var chunk = ids.slice(i, i + 450);
      var end = Math.min(i + 450, ids.length);
      chain = chain.then((function(ch, e) {
        return function() {
          var batch = db.batch();
          ch.forEach(function(id) {
            batch.update(db.collection('games').doc(id), {
              result:'', remarks:'', updatedBy:'', updatedTime:'',
              whiteFlags:0, blackFlags:0
            });
          });
          return batch.commit().then(function() { log('  ' + e + ' / ' + ids.length); });
        };
      })(chunk, end));
    }
    return chain;
  }).then(function() { log('\nRESET COMPLETE.'); ena(); })
    .catch(function(e) { log('ERROR: ' + e.message); ena(); });
});
